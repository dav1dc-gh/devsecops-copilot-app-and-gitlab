# ============================================================================
# CAPSTONE ARTIFACT — "Copilot cloud agent, rebuilt by hand on GitLab"
#
# This job works. You may keep it and run it. But before you do, read the
# annotations in docs/plumbing-tax.md and count what you are agreeing to own.
#
# Include from the lab repo's .gitlab-ci.yml:
#   include:
#     - local: 'ci/copilot-remediate.gitlab-ci.yml'
# ============================================================================

copilot-remediate:
  stage: security
  image: $CI_REGISTRY_IMAGE/copilot-runner:1
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

  variables:
    # PLUMBING 1 — Authentication.
    # Copilot CLI accepts only a *user-owned* fine-grained PAT with the
    # "Copilot Requests" account permission. Organisation-owned tokens cannot
    # carry that permission, and classic PATs are not supported at all.
    # This pipeline therefore runs on a named individual's Copilot seat and
    # consumes their AI credits. When they leave, this job stops working.
    COPILOT_GITHUB_TOKEN: $COPILOT_PAT

    # PLUMBING 2 — A second, unrelated credential for pushing to GitLab.
    # Different issuer, different expiry, different rotation runbook.
    GITLAB_TOKEN: $GLAB_PAT
    GITLAB_HOST: $CI_SERVER_URL

    # PLUMBING 3 — Non-interactive config. Without a writable COPILOT_HOME the
    # CLI has nowhere to resolve trust and permission state from.
    COPILOT_HOME: $CI_PROJECT_DIR/.copilot-ci

    GIT_STRATEGY: clone
    GIT_DEPTH: "0"

  before_script:
    - git config user.email "copilot-agent@${CI_SERVER_HOST}"
    - git config user.name "Copilot Agent (via ${GITLAB_USER_LOGIN})"
    - mkdir -p "$COPILOT_HOME"
    - npm ci

  script:
    # The scanner finds. The agent fixes. Keep those two roles separate.
    - osv-scanner --format json --output findings.json ./ || true
    - |
      if [ "$(jq '[.results[]?.packages[]?.vulnerabilities[]?] | length' findings.json)" -eq 0 ]; then
        echo "No vulnerabilities found. Nothing to remediate."
        exit 0
      fi

    # PLUMBING 4 — Every guardrail is a flag you wrote and now maintain.
    #   --no-ask-user      : without it the agent can block forever on a prompt
    #   --secret-env-vars  : GITLAB_TOKEN is NOT redacted by default. Only the
    #                        GitHub token variables are.
    #   --deny-tool        : your hand-rolled blast-radius limit
    #   --share            : your only audit trail (see PLUMBING 6)
    # Deliberately NOT used: --share-gist, which would publish this session
    # transcript to a GitHub gist. On a "no code leaves our estate" policy that
    # is an exfiltration path, not a convenience.
    - |
      copilot -p "Read findings.json. Remediate the highest-severity fixable
      dependency vulnerability by bumping it to the lowest fixed version.
      Run 'npm test' and confirm it passes. Do not modify application logic.
      Do not upgrade unrelated packages. Do not create the branch or commit -
      leave the working tree dirty and summarise what you changed." \
        -s \
        --no-ask-user \
        --agent security-reviewer \
        --model "$COPILOT_MODEL" \
        --allow-tool='write' \
        --allow-tool='shell(npm ci)' \
        --allow-tool='shell(npm test)' \
        --allow-tool='shell(npm install)' \
        --deny-tool='shell(git push)' \
        --deny-tool='shell(rm)' \
        --deny-tool='shell(curl)' \
        --secret-env-vars='GITLAB_TOKEN,COPILOT_PAT,GLAB_PAT' \
        --share="$CI_PROJECT_DIR/agent-session.md"

    # PLUMBING 5 — Branch, commit, push and MR creation are all yours to write.
    - |
      if git diff --quiet; then
        echo "Agent produced no changes. Exiting without a merge request."
        exit 0
      fi
    - BRANCH="copilot/remediate-${CI_PIPELINE_ID}"
    - git checkout -b "$BRANCH"
    - git add -A
    - git commit -m "fix(deps): automated remediation from pipeline ${CI_PIPELINE_ID}"
    - git push "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$BRANCH"
    - glab mr create --source-branch "$BRANCH" --target-branch "$CI_DEFAULT_BRANCH"
        --title "Automated dependency remediation (pipeline ${CI_PIPELINE_ID})"
        --description "$(head -c 60000 "$CI_PROJECT_DIR/agent-session.md")"
        --yes

  # PLUMBING 6 — Audit. A job artifact with an expiry is the whole record of
  # what an autonomous agent did to your codebase. There is no session view,
  # no way to replay it, and no way to steer it while it runs.
  artifacts:
    when: always
    paths:
      - agent-session.md
      - findings.json
    expire_in: 90 days

  # PLUMBING 7 — Concurrency is yours. Fanning this out across 200 repositories
  # means 200 runner slots, 200 schedules, and 200 pipelines you operate.
  timeout: 30m
