# Facilitator reference: what a good Lab 3 answer looks like.
# Attendees will not produce this exactly. Anything that runs the scanners, fails the
# pipeline on a secret, publishes reports as artifacts, and invokes the security-reviewer
# agent behind a manual gate is a pass.
#
# Required CI/CD variables, both masked and protected:
#   COPILOT_PAT  fine-grained PAT on a *personal* account with the "Copilot Requests"
#                account permission. Organisation tokens cannot carry it; classic PATs
#                are not supported at all.
#   GLAB_PAT     api + write_repository, used to push the branch and open the MR.
stages:
  - test
  - security
  - remediate

default:
  image: node:22-bookworm-slim

variables:
  OSV_SCANNER_VERSION: "2.5.1"
  GITLEAKS_VERSION: "8.21.2"
  COPILOT_CLI_VERSION: "1.0.80"
  GLAB_VERSION: "1.75.0"

unit-tests:
  stage: test
  script:
    - cd lab-app
    - npm ci
    - npm test

dependency-scan:
  stage: security
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - curl -sSfL -o /usr/local/bin/osv-scanner
      "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
    - chmod +x /usr/local/bin/osv-scanner
  script:
    # Exit 1 means "vulnerabilities found", which is not a pipeline failure here - this
    # report is the input to the remediation job. Any other non-zero exit is a real
    # scanner failure and must not be swallowed.
    - osv-scanner --format json --output-file findings.json ./ || [ $? -eq 1 ]
    - osv-scanner --format table ./ || [ $? -eq 1 ]
  artifacts:
    when: always
    paths:
      - findings.json
    expire_in: 30 days

secret-scan:
  stage: security
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates tar
    - curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
      | tar -xz -C /usr/local/bin gitleaks
  script:
    # This one does fail the pipeline. A leaked credential is not a warning.
    - gitleaks detect --no-git --redact --report-format json --report-path gitleaks-report.json
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 30 days

# The point of Lab 3: the agent the attendees built in Lab 2, called with nobody driving.
# For the fully annotated capstone version of this job, see ci/copilot-remediate.gitlab-ci.yml.
copilot-remediate:
  stage: remediate
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - when: manual
  needs:
    - job: dependency-scan
      artifacts: true
  variables:
    COPILOT_GITHUB_TOKEN: $COPILOT_PAT
    GITLAB_TOKEN: $GLAB_PAT
    GITLAB_HOST: $CI_SERVER_URL
    # Repository hooks in .github/hooks/ are NOT loaded in prompt mode without this.
    # Omit it and the secret-guard hook from Lab 2 silently does nothing here.
    GITHUB_COPILOT_PROMPT_MODE_REPO_HOOKS: "true"
    # The CLI needs a writable home to resolve trust and permission state from.
    COPILOT_HOME: $CI_PROJECT_DIR/.copilot-ci
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git tar
    - curl -sSfL "https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VERSION}/downloads/glab_${GLAB_VERSION}_linux_amd64.tar.gz"
      | tar -xz -C /usr/local bin/glab
    - npm install -g "@github/copilot@${COPILOT_CLI_VERSION}"
    - mkdir -p "$COPILOT_HOME"
    - git config user.email "copilot-agent@${CI_SERVER_HOST}"
    - git config user.name "Copilot Agent (via ${GITLAB_USER_LOGIN})"
  script:
    # The prompt is one line because Lab 2 moved everything else into AGENTS.md and
    # the agent file. That is the whole argument of the workshop, in one command.
    #
    # --no-ask-user      : without it the agent can block forever on a prompt
    # --secret-env-vars  : GITLAB_TOKEN is NOT redacted by default, only the GitHub ones
    # --deny-tool        : stop the agent editing the guardrail that constrains it
    # --share            : the only audit trail this run produces
    # Deliberately NOT used: --share-gist, which publishes the transcript to a GitHub
    # gist. On a "no code leaves our estate" policy that is an exfiltration path.
    - |
      copilot \
        -p "Remediate the highest-severity finding in findings.json and open a merge request for it." \
        --agent security-reviewer \
        --no-ask-user \
        --allow-tool 'shell(npm:*)' 'shell(git:*)' 'shell(glab:*)' \
        --deny-tool 'write(.github/hooks/**)' \
        --secret-env-vars COPILOT_GITHUB_TOKEN,GITLAB_TOKEN,COPILOT_PAT,GLAB_PAT \
        --share copilot-session.md \
        -s
  artifacts:
    when: always
    paths:
      - copilot-session.md
      - findings.json
    expire_in: 90 days
  timeout: 30m
